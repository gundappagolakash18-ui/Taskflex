# TASKFLEX on Render — blueprint deployment.
# Apply with: Render Dashboard -> New -> Blueprint -> pick this repo.
# Secrets marked `sync: false` are prompted for in the dashboard and never stored in git.

databases:
  - name: taskflex-db
    plan: free
    region: oregon
    postgresMajorVersion: "18"

services:
  - type: keyvalue
    name: taskflex-redis
    plan: free
    region: oregon
    ipAllowList: []

  - type: web
    name: taskflex-api
    runtime: docker
    plan: free
    region: oregon
    rootDir: backend
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: DEBUG
        value: "false"
      # First boot creates the operator account + skills; later boots skip seeding.
      - key: SEED_ON_START
        value: "true"
      - key: UPLOAD_DIR
        value: /app/uploads

      - key: DATABASE_URL
        fromDatabase:
          name: taskflex-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: taskflex-redis
          property: connectionString

      - key: JWT_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: OTP_PEPPER
        generateValue: true
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: "30"
      - key: REFRESH_TOKEN_EXPIRE_DAYS
        value: "14"

      # Required in production: signups use email OTP. SendGrid is the default
      # because Render's free plan blocks every SMTP port (25/465/587), so
      # Gmail SMTP cannot send from a free instance no matter the credentials.
      - key: EMAIL_PROVIDER
        value: sendgrid
      - key: SENDGRID_API_KEY
        sync: false
      - key: SMTP_HOST
        value: smtp.gmail.com
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: EMAIL_FROM
        sync: false

      # Public web origin (update if Render assigns a different hostname).
      - key: FRONTEND_ORIGIN
        value: https://taskflex-web.onrender.com
      - key: CORS_ORIGINS
        value: https://taskflex-web.onrender.com
      - key: GOOGLE_CLIENT_ID
        sync: false

      - key: AI_PROVIDER
        value: mock
      - key: OPENAI_API_KEY
        sync: false
      - key: MAPS_PROVIDER
        value: osm

      - key: PAYMENT_PROVIDER
        value: razorpay
      - key: RAZORPAY_KEY_ID
        sync: false
      - key: RAZORPAY_KEY_SECRET
        sync: false
      - key: RAZORPAY_WEBHOOK_SECRET
        sync: false

      - key: PLATFORM_COMMISSION_PERCENT
        value: "10.0"
      - key: DEFAULT_WORKER_RADIUS_KM
        value: "8.0"
      - key: OFFER_TTL_MINUTES
        value: "15"
      - key: MAX_OFFERS_PER_TASK
        value: "6"

  - type: web
    name: taskflex-web
    runtime: docker
    plan: free
    region: oregon
    rootDir: frontend
    dockerfilePath: ./Dockerfile
    # Keep this independent of the API so a cold-starting backend
    # cannot make the web service look unhealthy.
    healthCheckPath: /
    autoDeploy: true
    envVars:
      # nginx proxies /api, /ws, /uploads and /health to the API. The public
      # URL is used on purpose: requests through Render's edge wake a
      # spun-down free instance, and nginx need not resolve a private name.
      - key: BACKEND_URL
        value: https://taskflex-api.onrender.com
