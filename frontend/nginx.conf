server {
    listen __PORT__;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Resolve the API per request: nginx cannot start if an upstream hostname
    # fails to resolve at boot, and Render's DNS is not ready that early.
    resolver __RESOLVER__ valid=10s ipv6=off;

    set $backend "__BACKEND_URL__";
    set $backend_host "__BACKEND_HOST__";

    # Task proof photos and ID documents can be up to 10 MB.
    client_max_body_size 12m;

    # gzip for text assets
    gzip on;
    gzip_types text/plain text/css application/json application/javascript image/svg+xml;
    gzip_min_length 1024;

    # hashed build assets — cache hard
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # health probe — lets load balancers check the exposed port
    location = /health {
        proxy_pass $backend$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Host __HOST_HEADER__;
        proxy_ssl_server_name on;
        proxy_ssl_name $backend_host;
    }

    # REST API -> backend
    location /api/ {
        proxy_pass $backend$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Host __HOST_HEADER__;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto __CLIENT_PROTO__;
        proxy_ssl_server_name on;
        proxy_ssl_name $backend_host;
        # A spun-down free instance takes ~50s to boot.
        proxy_connect_timeout 120s;
        proxy_read_timeout 120s;
    }

    # WebSocket -> backend (/ws and /ws/chat/{task_id})
    location /ws {
        proxy_pass $backend$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host __HOST_HEADER__;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto __CLIENT_PROTO__;
        proxy_ssl_server_name on;
        proxy_ssl_name $backend_host;
        proxy_connect_timeout 120s;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # uploaded files are served by the backend (auth-gated for private docs)
    location /uploads/ {
        proxy_pass $backend$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Host __HOST_HEADER__;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_ssl_server_name on;
        proxy_ssl_name $backend_host;
    }

    # SPA fallback
    location / {
        try_files $uri $uri/ /index.html;
    }
}
